# Blueprint Render untuk backend CraftAI Studio.
# Deploy: Render -> New+ -> Blueprint -> pilih repo ini -> deploy otomatis.
# Lihat docs/DEPLOY.md untuk langkah lengkap (termasuk isi env di Vercel).

services:
  - type: web
    name: craftai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/templates
    envVars:
      # Wajib di production: mematikan log debug & mengaktifkan trust proxy
      # (rate limit per-IP) + cookie admin Secure.
      - key: NODE_ENV
        value: production
      # SQLite disimpan di disk persistent supaya data selamat redeploy.
      - key: DB_DIR
        value: /var/data
      # Isi MANUAL setelah frontend ada di Vercel (URL https://<proj>.vercel.app).
      # Kosongkan dulu agar blueprint bisa di-deploy; isi lalu redeploy.
      - key: FRONTEND_ORIGIN
        sync: false
      # Isi manual juga (bila kosong backend memakai default admin123).
      - key: ADMIN_PASSWORD
        sync: false
    disks:
      - name: craftai-data
        mountPath: /var/data
        sizeGB: 1